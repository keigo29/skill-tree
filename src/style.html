<style>
/* Layout: 半円形のスキルツリーが主役。下に「毎日確認（Workstation と同じ操作感）」「スキル詳細・編集」、その下に草グラフとデータ管理（単一のダークテーマ） */
:root{
  color-scheme:dark;
  --bg:#0c0e13; --bg-2:#141821; --panel:#171b25; --soft:#1e2330; --line:#2a303d;
  --ink:#ece8df; --ink-dim:#8a8f9c; --ink-faint:#4b5161;
  --accent:#c99a62; --accent-soft:rgba(201,154,98,.18); --ok:#7fb08a; --rest:#8f7a4e; --bad:#e08a7a;
  --gloss:radial-gradient(111% 112% at 23% 0%,rgba(255,255,255,.28) 0%,rgba(255,255,255,0) 100%);
  --g0:#1a1e28; --g1:#4a3a27; --g2:#7a5c39; --g3:#a87c4c; --g4:#e0b27a;  /* 草グラフ 0〜4+ */
  --font-label:"Josefin Sans","Zen Kaku Gothic New",system-ui,sans-serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.7;
  background-image:radial-gradient(ellipse 80% 50% at 50% 30%,#1a1f2b 0%,transparent 70%);min-height:100vh}
button{font-family:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:8px}
.eyebrow{font-family:var(--font-label);font-size:12px;letter-spacing:.32em;color:var(--ink-dim);text-transform:uppercase}
h1{margin:2px 0 0;font-size:22px;font-weight:700;letter-spacing:.06em;text-wrap:balance}
.badges{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-dim);border:1px solid var(--line);padding:4px 10px;border-radius:999px;background:none}
.badge svg{width:14px;height:14px}
button.badge{cursor:pointer;color:var(--ink)}
button.badge.on{background:var(--accent);border-color:var(--accent);color:#1b1408;font-weight:700}

/* ---- ツリー ---- */
.tree-scroll{overflow-x:auto;overflow-y:hidden;margin-inline:-4px;scrollbar-width:thin}
.tree{position:relative;min-width:800px;aspect-ratio:1000/520}
.tree #bolts{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tree svg.edges{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.watermark{position:absolute;left:50%;top:16%;transform:translateX(-50%);font-family:var(--font-label);font-weight:600;
  font-size:clamp(60px,11vw,140px);letter-spacing:.08em;color:rgba(255,255,255,.035);white-space:nowrap;pointer-events:none;user-select:none}
.blabel{position:absolute;font-family:var(--font-label);line-height:1.2;pointer-events:none;white-space:nowrap}
.blabel b{display:block;font-family:var(--font-body);font-size:15px;letter-spacing:.18em;color:var(--ink)}
.blabel span{font-size:10px;letter-spacing:.34em;color:var(--ink-faint)}
.blabel small{display:block;font-size:11px;color:var(--accent);letter-spacing:.1em;margin-top:2px}
.node{position:absolute;transform:translate(-50%,-50%);width:50px;height:50px;border-radius:50%;padding:0;cursor:pointer;
  display:grid;place-items:center;border:1.5px solid var(--ink-faint);background:var(--bg-2);color:var(--ink-faint);
  transition:transform .2s ease,background .2s,color .2s,border-color .2s,box-shadow .2s}
.node svg{width:22px;height:22px;stroke-width:1.6;position:relative}
.node.cap{width:60px;height:60px}.node.cap svg{width:26px;height:26px}
.node.root{width:66px;height:66px}.node.root svg{width:28px;height:28px}
/* 挑戦中：まわりの輪がチェック回数で満ちていく */
.node.avail{border-color:transparent;color:var(--accent);background:var(--bg-2)}
.node.avail::before{content:"";position:absolute;inset:-5px;border-radius:50%;
  background:conic-gradient(var(--accent) calc(var(--p,0)*1%),rgba(201,154,98,.18) 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3.5px))}
.node.on{background:var(--ink);border-color:var(--ink);color:#1b1e26;box-shadow:0 0 18px rgba(236,232,223,.18)}
.node.sel{box-shadow:0 0 0 6px var(--bg),0 0 0 8px var(--ink)}
.node.on.sel{box-shadow:0 0 0 6px var(--bg),0 0 0 8px var(--ink),0 0 24px rgba(236,232,223,.2)}
.node:hover{transform:translate(-50%,-50%) scale(1.08)}
.node:focus-visible{outline:2px solid var(--accent);outline-offset:8px}
.node.pop{animation:pop .6s ease}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(1)}40%{transform:translate(-50%,-50%) scale(1.3);box-shadow:0 0 40px var(--accent)}100%{transform:translate(-50%,-50%) scale(1)}}

.points{display:flex;flex-direction:column;align-items:center;gap:4px;margin:6px 0 26px}
.points .num{font-family:var(--font-label);font-size:44px;font-weight:300;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.points .num small{font-size:20px;margin-left:2px}
.points .lbl{font-family:var(--font-label);font-size:11px;letter-spacing:.34em;color:var(--ink-dim)}
.bar{width:min(260px,70%);height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .5s}
.points .sub{font-size:12px;color:var(--ink-faint);text-align:center}

/* ---- パネル ---- */
.grid{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px 20px;min-width:0}
.panel h2{margin:0;font-size:19px;font-weight:700;letter-spacing:.08em;display:flex;align-items:center;gap:8px}
.panel h2 svg{width:19px;height:19px;color:var(--accent)}
.phead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.streak{display:flex;align-items:center;gap:5px;font-family:var(--font-label);font-size:20px;color:var(--accent);font-variant-numeric:tabular-nums}
.streak svg{width:20px;height:20px}
.streak small{font-family:var(--font-body);font-size:12px;color:var(--ink-dim)}

/* 毎日確認（Workstation の hb- と同じ形） */
.week{display:grid;grid-template-columns:30px repeat(7,minmax(0,1fr)) 30px;align-items:center;gap:2px;margin:0 -4px 12px}
.iconBtn{width:30px;height:30px;border:0;background:none;border-radius:50%;display:grid;place-items:center;color:var(--ink-dim);cursor:pointer;padding:0}
.iconBtn svg{width:18px;height:18px}
.iconBtn:disabled{opacity:.25;cursor:default}
.wday{border:0;background:none;padding:4px 0 6px;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-width:0}
.wday small{font-size:11px;color:var(--ink-dim);font-weight:700}
.wday b{font-size:15px;font-weight:700;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.wday.today b{box-shadow:inset 0 0 0 1.5px var(--ink)}
.wday.sel b{background:var(--gloss),var(--ink);color:#1b1e26}
.wday.future{opacity:.3;cursor:default}
.wday i{width:22px;height:4px;border-radius:2px;background:var(--line);overflow:hidden;display:block}
.wday i span{display:block;height:100%;background:var(--accent);border-radius:2px}
.wday.all i span{background:var(--ok)}
.wday.offd i{background:repeating-linear-gradient(135deg,transparent 0 2px,var(--rest) 2px 3px)}
.hb-top{display:flex;align-items:center;gap:14px}
.hb-ring{position:relative;width:64px;height:64px;flex-shrink:0}
.hb-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.hb-ring circle{fill:none;stroke-width:7}
.hb-ring .bgc{stroke:var(--soft)}
.hb-ring .fgc{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .3s}
.hb-top.all .fgc{stroke:var(--ok)}
.hb-ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.hb-text{flex:1;min-width:0}
.hb-text .date{font-size:18px;font-weight:700}
.hb-text .msg{font-size:13px;color:var(--ink-dim);margin-top:2px;display:flex;align-items:center;gap:5px}
.hb-text .msg svg{width:15px;height:15px}
.hb-top.all .msg{color:var(--ok);font-weight:700}
.softBtn{width:100%;height:38px;margin:12px 0 4px;font-size:13px;background:var(--soft);border:0;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;color:var(--ink-dim)}
.softBtn svg{width:16px;height:16px}
.hb-head{display:flex;align-items:center;justify-content:space-between;margin:12px 2px 4px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;font-weight:700;color:var(--ink-dim)}
.hb-list{display:flex;flex-direction:column;gap:2px}
.hb-row{display:flex;align-items:center;gap:6px;padding:2px 2px 2px 4px;border-radius:16px;min-width:0}
.hb-row:hover{background:rgba(255,255,255,.025)}
.hb-row.met .hb-name{opacity:.55}
.hb-chk{width:28px;height:28px;flex-shrink:0;border-radius:50%;border:2px solid var(--ink-faint);background:none;color:transparent;display:grid;place-items:center;padding:0;cursor:pointer;transition:transform .1s}
.hb-chk:active{transform:scale(.88)}
.hb-chk.done{border:0;background:var(--gloss),var(--c);color:#14161c}
.hb-chk.met{border-style:dashed;color:var(--ink-faint)}
.hb-chk svg{width:16px;height:16px;stroke-width:3}
.hb-chk:focus-visible,.hb-name:focus-visible,.wday:focus-visible,.cell:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hb-name{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:none;padding:7px 4px;text-align:left;border-radius:12px;cursor:pointer}
.hb-icon{width:32px;height:32px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--panel))}
.hb-icon svg{width:17px;height:17px}
.hb-name .txt{min-width:0;flex:1;display:flex;flex-direction:column;gap:1px}
.hb-name .nm{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-name small{font-size:12px;color:var(--ink-dim);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb-name small .fq{color:var(--c);font-weight:700}
.prog{height:3px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:4px}
.prog i{display:block;height:100%;background:var(--c);border-radius:2px}
.hb-sep{font-size:11px;font-weight:700;color:var(--ink-dim);margin:10px 4px 2px}
.empty{font-size:13px;color:var(--ink-dim);padding:14px 6px;display:flex;gap:8px;align-items:flex-start}
.empty svg{width:18px;height:18px;flex:none;margin-top:2px;color:var(--accent)}

/* 詳細 */
.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--font-label);font-size:12px;letter-spacing:.18em;margin:6px 0 10px;border-bottom:1px solid var(--line);padding-bottom:10px}
.meta .cost{color:var(--accent)}.meta .br{color:var(--ink-dim)}
.desc{margin:0 0 14px;max-width:60ch}
.practice{display:flex;gap:10px;align-items:flex-start;background:var(--bg-2);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--ink-dim)}
.practice svg{width:18px;height:18px;flex:none;margin-top:3px;color:var(--accent)}
.practice b{color:var(--ink);font-weight:500}
.dprog{margin-top:14px}
.dprog .row{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--ink-dim)}
.dprog .row b{font-family:var(--font-label);font-size:22px;font-weight:400;color:var(--ink);font-variant-numeric:tabular-nums}
.dprog .track{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;margin-top:6px}
.dprog .track i{display:block;height:100%;background:var(--gloss),var(--accent);border-radius:3px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;margin-top:12px;border:1px solid var(--line);color:var(--ink-dim)}
.status svg{width:14px;height:14px}
.status.on{color:var(--ink);border-color:var(--ink)}
.status.go{color:var(--accent);border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:700;letter-spacing:.08em;
  border:1px solid var(--accent);background:var(--gloss),var(--accent);color:#1b1408;padding:11px 20px;border-radius:12px;cursor:pointer;margin-top:14px;width:100%}
.btn svg{width:18px;height:18px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.danger{background:transparent;color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.btn:disabled{background:transparent;color:var(--ink-faint);border-color:var(--line);cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.hint{font-size:12px;color:var(--ink-faint);margin-top:8px}

/* 編集フォーム */
.form{display:flex;flex-direction:column;gap:12px}
.form h3{margin:8px 0 0;font-size:12px;letter-spacing:.2em;color:var(--ink-dim);font-family:var(--font-label);font-weight:600;border-top:1px solid var(--line);padding-top:12px}
.form h3:first-child{border-top:0;padding-top:0;margin-top:0}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:12px;color:var(--ink-dim)}
.fld input,.fld select,.fld textarea{width:100%;background:var(--bg-2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit;font-size:14px}
.fld textarea{min-height:64px;resize:vertical;font-size:14px}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--accent)}
.fld input[type=color]{padding:3px;height:40px;cursor:pointer}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.iconRow{display:flex;gap:8px;align-items:center}
.iconRow .pv{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:#1b1e26}
.iconRow .pv svg{width:20px;height:20px}
.ipick{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:4px;max-height:150px;overflow:auto;padding:6px;background:var(--bg-2);border-radius:10px;border:1px solid var(--line)}
.ipick button{height:34px;border:0;border-radius:8px;background:none;display:grid;place-items:center;cursor:pointer;color:var(--ink-dim)}
.ipick button:hover,.ipick button.on{background:var(--soft);color:var(--ink)}
.ipick button svg{width:18px;height:18px}
.needRow{display:flex;gap:8px;align-items:stretch}
.needRow input{flex:1;min-width:0;background:var(--bg-2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit;font-size:14px}
.needRow input:focus{outline:none;border-color:var(--accent)}
.needRow button{flex:none;font-size:12px;border:1px solid var(--line);background:none;border-radius:10px;padding:0 10px;cursor:pointer;color:var(--ink-dim)}
.needRow button:hover{color:var(--ink);border-color:var(--ink-dim)}

/* 草グラフ */
.contrib{margin-top:20px}
.csum{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--ink-dim)}
.csum b{font-family:var(--font-label);font-size:20px;color:var(--ink);font-weight:400;margin-right:3px;font-variant-numeric:tabular-nums}
.cscroll{overflow-x:auto;margin-top:12px;padding-bottom:4px;scrollbar-width:thin}
.cgrid{display:grid;grid-template-columns:22px repeat(53,13px);grid-template-rows:16px repeat(7,13px);gap:3px;width:max-content}
.cgrid .mon{font-size:10px;color:var(--ink-dim);white-space:nowrap;grid-row:1;line-height:16px}
.cgrid .wdl{font-size:10px;color:var(--ink-faint);grid-column:1;line-height:13px}
.cell{width:13px;height:13px;border-radius:3px;background:var(--g0);border:0;padding:0;cursor:pointer}
.cell.l1{background:var(--g1)}.cell.l2{background:var(--g2)}.cell.l3{background:var(--g3)}.cell.l4{background:var(--g4)}
.cell.off{background:repeating-linear-gradient(135deg,var(--g0) 0 2px,var(--rest) 2px 3px)}
.cell.fut{background:transparent;cursor:default}
.cell.sel{box-shadow:0 0 0 1.5px var(--ink)}
.legend{display:flex;align-items:center;gap:4px;justify-content:flex-end;font-size:11px;color:var(--ink-faint);margin-top:8px}
.legend .cell{cursor:default}

/* データ */
.data{margin-top:20px}
.data p{margin:4px 0 0;font-size:13px;color:var(--ink-dim);max-width:70ch}
.drow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.drow .btn{width:auto;margin-top:0;font-size:13px;padding:9px 16px}
.data textarea{width:100%;min-height:90px;margin-top:6px;background:var(--bg-2);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:12px/1.5 ui-monospace,Menlo,monospace;resize:vertical}
.data textarea:focus{outline:none;border-color:var(--accent)}

.data code,.form code{font:12px ui-monospace,Menlo,monospace;background:var(--bg-2);padding:1px 6px;border-radius:6px;color:var(--ink)}
.err{color:var(--bad)!important}
#syncBox{margin-top:6px}
.sub-h{margin:18px 0 0;font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.sub-h svg{width:16px;height:16px;color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--ink);color:#1b1e26;font-weight:700;padding:10px 18px;border-radius:12px;transition:.3s;display:flex;gap:8px;align-items:center;font-size:14px;max-width:calc(100% - 32px);z-index:20}
.toast svg{width:18px;height:18px;flex:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.node.pop{animation:none}*{transition:none!important}}
</style>
